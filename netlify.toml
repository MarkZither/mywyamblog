# General pattern redirects - these come AFTER specific redirects
# NOTE: Netlify doesn't support named placeholder syntax like :year-:month-:day-:slug
# So we cannot use a pattern to transform /posts/2025-10-20-slug to /2025/10/20/slug
# Instead, this pattern is handled by Docusaurus client-side redirects (see docusaurus.config.ts)

# DO NOT add a /posts/* fallback redirect here!
# It would interfere with Docusaurus client-side redirects for date-based posts
# Date-based posts like /posts/2025-10-20-slug are handled by Docusaurus createRedirects function

# Redirect old /docs/blog/ URLs to root (where blog now lives)
[[redirects]]
  from = "/docs/blog/*"
  to = "/:splat"
  status = 301
  force = true

# Redirect /docs/docs/ to /docs/
[[redirects]]
  from = "/docs/docs/*"
  to = "/docs/:splat"
  status = 301
  force = true

# Feed redirects for backward compatibility
[[redirects]]
  from = "/feed.rss"
  to = "/rss.xml"
  status = 200

[[redirects]]
  from = "/feed.atom"
  to = "/atom.xml"
  status = 200

# SPA routing for Docusaurus (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better caching
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"