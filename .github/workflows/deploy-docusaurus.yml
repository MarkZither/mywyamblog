# This workflow builds Docusaurus as primary and Statiq as backup for Netlify

name: Deploy Docusaurus Blog (with Statiq Backup) to Netlify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    # Setup .NET for Statiq
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Setup Node.js for Docusaurus
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/docs/package-lock.json

    # Build Statiq blog
    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build .NET project
      run: dotnet build --no-restore

    - name: Generate Statiq site
      run: dotnet run --project src/blog/mywyamblog.csproj -- -l Information
      env:
        DeployNetlifySiteId: ${{ secrets.DEPLOYNETLIFYSITEID }}
        DeployNetlifyAccessToken: ${{ secrets.DEPLOYNETLIFYACCESSTOKEN }}

    # Build Docusaurus
    - name: Install Docusaurus dependencies
      working-directory: ./src/docs
      run: npm ci

    - name: Build Docusaurus site
      working-directory: ./src/docs
      run: npm run build

    # Combine both sites - Docusaurus at root, Statiq at backup URL
    - name: Combine sites
      run: |
        # Create combined output directory
        mkdir -p combined-site
        
        # Copy Docusaurus build to root (primary blog)
        if [ -d "src/docs/build" ]; then
          cp -r src/docs/build/* combined-site/
        fi
        
        # Copy Statiq output to /statiq-backup subdirectory for comparison
        if [ -d "output" ]; then
          mkdir -p combined-site/statiq-backup
          cp -r output/* combined-site/statiq-backup/
        fi
        
        # Copy netlify.toml to the deployment directory
        # This is CRITICAL - Netlify needs this file to process redirects
        if [ -f "netlify.toml" ]; then
          cp netlify.toml combined-site/
          echo "✓ netlify.toml copied to combined-site/"
        else
          echo "⚠ WARNING: netlify.toml not found in repository root"
          exit 1
        fi

    # Deploy to Netlify
    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './combined-site'
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions"
        enable-pull-request-comment: true
        enable-commit-comment: true
        overwrites-pull-request-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.DEPLOYNETLIFYACCESSTOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.DEPLOYNETLIFYSITEID }}