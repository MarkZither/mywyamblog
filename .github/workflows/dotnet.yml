# This workflow builds and deploys the Docusaurus blog to GitHub Pages
# For more information see: https://docusaurus.io/docs/deployment#deploying-to-github-pages


name: Build & Deploy Docusaurus Blog to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    # Setup Node.js for Docusaurus
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/docs/package-lock.json

    # Build Docusaurus with GitHub Pages base URL
    - name: Install Docusaurus dependencies
      working-directory: ./src/docs
      run: npm ci

    - name: Build Docusaurus site for GitHub Pages
      working-directory: ./src/docs
      run: npm run build
      env:
        # Override base URL for GitHub Pages deployment
        BASE_URL: /mywyamblog/
        URL: https://markzither.github.io

    # Publish to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: src/docs/build
        force_orphan: true
