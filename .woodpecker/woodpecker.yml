when:
  - event: push
    branch:
      - main
      - copilot/*
steps:
  - name: build-docusaurus
    image: node:20
    commands:
      - echo "Building Docusaurus site"
      - cd src/docs
      - npm ci --silent
      - npm run build
      - cd ../../
      - tar -czf docusaurus-build.tar.gz -C src/docs build
      - ls -la docusaurus-build.tar.gz
