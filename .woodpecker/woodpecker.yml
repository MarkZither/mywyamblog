when:
  - event: push

steps:
  - name: typecheck
    image: node:20
    commands:
      - cd src/docs
      - npm ci --silent
      - npm run typecheck

  - name: publish
    image: plugins/docker
    settings:
      repo:
        from_secret: docker_repo
      tags:
        - ${WOODPECKER_BRANCH}
        - ${WOODPECKER_COMMIT}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
