# Woodpecker CI pipeline: build Docusaurus static site and build/push Docker image
# Set secrets: docker_repo, docker_username, docker_password

pipeline:
  build:
    image: node:20-alpine
    commands:
      - cd src/docs
      - npm ci
      - npm run build

  docker:
    image: plugins/docker
    depends_on:
      - build
    settings:
      repo:
        from_secret: docker_repo
      tags: latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
